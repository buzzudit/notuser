<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Agent cover</title>
  <desc id="desc">A conceptual multi-agent dashboard showing telemetry flowing through analysis, stories, and UX proposals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eff6ff" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; }
      .title { font: 850 54px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { font: 750 22px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { font: 550 18px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1025" cy="130" r="210" fill="#93c5fd" opacity="0.18"/>
  <circle cx="110" cy="620" r="245" fill="#99f6e4" opacity="0.16"/>
  <path d="M118 284 C330 180 436 512 610 360 C782 210 920 500 1080 330" fill="none" stroke="#bfdbfe" stroke-width="4" opacity="0.26"/>

  <g filter="url(#shadow)">
    <rect x="126" y="116" width="952" height="504" rx="34" fill="url(#panel)"/>
    <rect x="126" y="116" width="952" height="62" rx="34" fill="#0f172a"/>
    <circle cx="168" cy="147" r="9" fill="#fb7185"/>
    <circle cx="200" cy="147" r="9" fill="#fbbf24"/>
    <circle cx="232" cy="147" r="9" fill="#34d399"/>
    <text x="275" y="156" fill="#e2e8f0" class="ui small">Agent intelligence</text>

    <rect x="170" y="224" width="204" height="352" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="206" y="268" fill="#0f172a" class="ui label">Outline</text>
    <rect x="206" y="316" width="120" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="206" y="356" width="146" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="206" y="396" width="92" height="18" rx="9" fill="#e2e8f0"/>
    <circle cx="272" cy="492" r="48" fill="#dbeafe"/>
    <path d="M236 492 H308 M272 456 V528" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

    <rect x="444" y="234" width="160" height="122" rx="22" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="478" y="284" fill="#1d4ed8" class="ui label">Analyst</text>
    <rect x="444" y="404" width="160" height="122" rx="22" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="486" y="454" fill="#0f766e" class="ui label">Story</text>
    <rect x="672" y="318" width="160" height="122" rx="22" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="718" y="368" fill="#92400e" class="ui label">UX</text>
    <path d="M604 296 H672 M604 466 C648 466 648 379 672 379" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>

    <rect x="900" y="224" width="164" height="352" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="936" y="268" fill="#0f172a" class="ui label">Trace</text>
    <circle cx="982" cy="348" r="14" fill="#2563eb"/>
    <circle cx="982" cy="408" r="14" fill="#0f766e"/>
    <circle cx="982" cy="468" r="14" fill="#ca8a04"/>
    <path d="M982 362 V394 M982 422 V454" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="92" y="84" fill="#bfdbfe" class="ui small">Lab trial</text>
  <text x="92" y="680" fill="#ffffff" class="ui title">UX telemetry, turned into product work</text>
</svg>
