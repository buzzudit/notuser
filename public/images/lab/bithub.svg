<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Bithub experiment cover</title>
  <desc id="desc">A conceptual interface showing non-developers working with Bitbucket files through a friendly desktop workspace without Git commands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.6" stop-color="#12335f"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; }
      .title { font: 850 54px Inter, ui-sans-serif, system-ui, sans-serif; }
      .copy { font: 600 25px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { font: 750 22px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { font: 550 18px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="0" fill="url(#bg)"/>
  <circle cx="1040" cy="105" r="190" fill="#22d3ee" opacity="0.18"/>
  <circle cx="120" cy="620" r="260" fill="#a7f3d0" opacity="0.16"/>
  <path d="M80 580 C300 420 410 650 590 500 C760 360 820 210 1110 275" fill="none" stroke="#67e8f9" stroke-width="3" opacity="0.25"/>
  <path d="M70 205 C260 320 375 130 560 245 C750 360 845 470 1140 390" fill="none" stroke="#bbf7d0" stroke-width="3" opacity="0.22"/>

  <g filter="url(#shadow)">
    <rect x="124" y="116" width="952" height="504" rx="34" fill="url(#panel)"/>
    <rect x="124" y="116" width="952" height="62" rx="34" fill="#0f172a"/>
    <circle cx="166" cy="147" r="9" fill="#fb7185"/>
    <circle cx="198" cy="147" r="9" fill="#fbbf24"/>
    <circle cx="230" cy="147" r="9" fill="#34d399"/>
    <text x="275" y="156" fill="#e2e8f0" class="ui small">Bithub workspace</text>

    <rect x="164" y="218" width="250" height="356" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="194" y="262" fill="#0f172a" class="ui label">Projects</text>
    <rect x="194" y="294" width="178" height="42" rx="14" fill="#dbeafe"/>
    <text x="216" y="322" fill="#1d4ed8" class="ui muted">Onboarding docs</text>
    <rect x="194" y="354" width="146" height="42" rx="14" fill="#ecfeff"/>
    <text x="216" y="382" fill="#0f766e" class="ui muted">Prototype</text>
    <rect x="194" y="414" width="185" height="42" rx="14" fill="#f1f5f9"/>
    <text x="216" y="442" fill="#334155" class="ui muted">Release notes</text>

    <rect x="456" y="218" width="420" height="356" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="492" y="262" fill="#0f172a" class="ui label">Edit repo files</text>
    <rect x="492" y="294" width="330" height="18" rx="9" fill="#cbd5e1"/>
    <rect x="492" y="332" width="290" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="492" y="370" width="345" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="492" y="408" width="250" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="492" y="470" width="185" height="54" rx="18" fill="#ccfbf1"/>
    <text x="522" y="505" fill="#0f766e" class="ui label">Autosaved</text>

    <rect x="914" y="218" width="212" height="356" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="948" y="262" fill="#0f172a" class="ui label">Sync</text>
    <circle cx="1006" cy="342" r="60" fill="#dcfce7"/>
    <path d="M976 342 l22 22 l45 -52" fill="none" stroke="#16a34a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="952" y="442" fill="#0f172a" class="ui label">No Git</text>
    <text x="945" y="474" fill="#475569" class="ui muted">commands</text>
    <text x="945" y="504" fill="#475569" class="ui muted">required</text>
  </g>

  <text x="92" y="84" fill="#a7f3d0" class="ui small">Lab trial</text>
  <text x="92" y="680" fill="#ffffff" class="ui title">Bitbucket work, without Git anxiety</text>
</svg>
