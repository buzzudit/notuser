<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AI-DLC Navigator cover</title>
  <desc id="desc">A conceptual interface showing AI assistants sharing one artifact-driven product navigation framework.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#ecfeff" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; }
      .title { font: 850 54px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { font: 750 22px Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { font: 550 18px Inter, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <circle cx="1025" cy="120" r="190" fill="#fde68a" opacity="0.18"/>
  <circle cx="110" cy="610" r="260" fill="#99f6e4" opacity="0.16"/>
  <path d="M130 360 C310 210 410 270 560 360 S850 520 1040 360" fill="none" stroke="#fef3c7" stroke-width="4" opacity="0.32"/>

  <g filter="url(#shadow)">
    <rect x="126" y="116" width="952" height="504" rx="34" fill="url(#panel)"/>
    <rect x="126" y="116" width="952" height="62" rx="34" fill="#0f172a"/>
    <circle cx="168" cy="147" r="9" fill="#fb7185"/>
    <circle cx="200" cy="147" r="9" fill="#fbbf24"/>
    <circle cx="232" cy="147" r="9" fill="#34d399"/>
    <text x="275" y="156" fill="#e2e8f0" class="ui small">Shared navigator</text>

    <rect x="174" y="222" width="260" height="352" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="206" y="266" fill="#0f172a" class="ui label">Assistants</text>
    <rect x="206" y="306" width="166" height="44" rx="15" fill="#dbeafe"/>
    <text x="226" y="335" fill="#1d4ed8" class="ui muted">Codex</text>
    <rect x="206" y="366" width="166" height="44" rx="15" fill="#ccfbf1"/>
    <text x="226" y="395" fill="#0f766e" class="ui muted">Claude</text>
    <rect x="206" y="426" width="166" height="44" rx="15" fill="#fef3c7"/>
    <text x="226" y="455" fill="#92400e" class="ui muted">Windsurf</text>

    <rect x="500" y="222" width="210" height="352" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="542" y="268" fill="#0f172a" class="ui label">ai-dlc/</text>
    <circle cx="605" cy="366" r="70" fill="#0f766e"/>
    <path d="M605 312 L645 366 L605 420 L565 366 Z" fill="#ecfeff"/>
    <circle cx="605" cy="366" r="18" fill="#fbbf24"/>
    <text x="548" y="498" fill="#475569" class="ui muted">One source</text>
    <text x="552" y="528" fill="#475569" class="ui muted">of truth</text>

    <rect x="778" y="222" width="252" height="352" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="812" y="266" fill="#0f172a" class="ui label">Stages</text>
    <rect x="812" y="306" width="160" height="30" rx="12" fill="#e0f2fe"/>
    <rect x="812" y="356" width="130" height="30" rx="12" fill="#ccfbf1"/>
    <rect x="812" y="406" width="184" height="30" rx="12" fill="#fef3c7"/>
    <rect x="812" y="456" width="146" height="30" rx="12" fill="#e2e8f0"/>
    <text x="812" y="530" fill="#475569" class="ui muted">Artifact gates</text>
  </g>

  <text x="92" y="84" fill="#fef3c7" class="ui small">Lab trial</text>
  <text x="92" y="680" fill="#ffffff" class="ui title">One method, many AI assistants</text>
</svg>
